<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FDM Downloader</title>
    <style>
      /* FDM design tokens, mirrored from the app (the extension can't read the
         app's CSS vars). Dark by default — the app's default theme — flipping to
         the app's light palette on a light OS. */
      :root {
        --bg: #0e0f12;
        --card: #17181c;
        --soft: #202229;
        --line: #272930;
        --line2: #34363d;
        --ink: #f2f3f5;
        --mut: #9aa1ad;
        --faint: #6b7280;
        --acc: #f2f3f5;
        --onacc: #15161a;
        --accw: rgba(242, 243, 245, 0.1);
        --ok: #22c55e;
        --warn: #e0a13a;
        --err: #f0616a;
        --shadow: 0 10px 28px rgba(8, 9, 14, 0.45);
        --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef0f6;
          --card: #ffffff;
          --soft: #f5f6f9;
          --line: #ebedf1;
          --line2: #dfe2e8;
          --ink: #1a1c23;
          --mut: #646b78;
          --faint: #9aa1ad;
          --acc: #1a1c23;
          --onacc: #ffffff;
          --accw: rgba(26, 28, 35, 0.07);
          --ok: #16a34a;
          --warn: #d9881f;
          --err: #e5484d;
          --shadow: 0 10px 28px rgba(20, 22, 40, 0.14);
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        width: 300px;
      }
      .wrap { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

      header { display: flex; align-items: center; gap: 10px; }
      .logo {
        width: 30px; height: 30px; border-radius: 9px;
        background: var(--acc); color: var(--onacc);
        display: grid; place-items: center; flex: none;
      }
      .logo svg { width: 17px; height: 17px; }
      header h1 { font-size: 14px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
      header .sub { font-size: 11px; color: var(--faint); margin-top: 1px; }

      /* Status pill — the everyday state. */
      .status {
        display: flex; align-items: center; gap: 9px;
        padding: 10px 12px; border-radius: 11px;
        background: var(--card); border: 1px solid var(--line);
        font-size: 12.5px; font-weight: 500;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
      .status.ok { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
      .status.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
      .status.fail { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); }
      .status.fail .dot { background: var(--err); }
      .status .msg { min-width: 0; line-height: 1.3; }

      /* Intercept toggle — the one everyday control. */
      .toggle {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 11px 12px; border-radius: 11px;
        background: var(--card); border: 1px solid var(--line);
      }
      .t-title { font-size: 12.5px; font-weight: 600; }
      .t-sub { font-size: 11px; color: var(--faint); margin-top: 2px; line-height: 1.3; }
      .switch { position: relative; width: 38px; height: 22px; flex: none; }
      .switch input { opacity: 0; width: 0; height: 0; }
      .slider {
        position: absolute; inset: 0; cursor: pointer; border-radius: 999px;
        background: var(--soft); border: 1px solid var(--line2);
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .slider::before {
        content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px;
        background: var(--faint); border-radius: 50%;
        transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), background 0.15s ease;
      }
      .switch input:checked + .slider { background: var(--acc); border-color: var(--acc); }
      .switch input:checked + .slider::before { transform: translateX(16px); background: var(--onacc); }

      /* Setup — collapsed once paired; the details/summary is native + JS-opened
         automatically when there's no token yet. */
      details.setup {
        border: 1px solid var(--line); border-radius: 11px;
        background: var(--card); overflow: hidden;
      }
      details.setup > summary {
        list-style: none; cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 8px;
        padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink);
      }
      details.setup > summary::-webkit-details-marker { display: none; }
      summary .chev { margin-left: auto; color: var(--faint); transition: transform 0.18s ease; }
      details[open] summary .chev { transform: rotate(90deg); }
      summary .paired { font-size: 11px; font-weight: 500; color: var(--ok); margin-left: auto; }
      .setup-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }

      label {
        display: block; font-family: var(--mono);
        font-size: 10px; font-weight: 600; color: var(--faint);
        text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px;
      }
      input[type="text"], input[type="password"], input[type="number"] {
        width: 100%; background: var(--bg); color: var(--ink);
        border: 1px solid var(--line2); border-radius: 8px;
        padding: 8px 10px; font: inherit; outline: none;
        transition: border-color 0.12s ease;
      }
      input::placeholder { color: var(--faint); }
      input:focus { border-color: var(--acc); }
      .row { display: flex; gap: 8px; }
      .row > .grow { flex: 1; }
      .row > .port { width: 84px; flex: none; }

      button {
        font: inherit; font-weight: 600; cursor: pointer;
        border-radius: 8px; padding: 9px 12px; border: 1px solid transparent;
        transition: opacity 0.12s ease, background 0.12s ease, transform 0.04s ease;
      }
      button:active { transform: translateY(1px); }
      button.primary { background: var(--acc); color: var(--onacc); }
      button.primary:hover { opacity: 0.9; }
      button.ghost { background: var(--card); color: var(--ink); border-color: var(--line2); }
      button.ghost:hover { background: var(--soft); }
      button.full { width: 100%; }
      .iconbtn {
        flex: none; width: 40px; display: grid; place-items: center;
        background: var(--card); color: var(--mut); border: 1px solid var(--line2);
        border-radius: 8px; cursor: pointer;
      }
      .iconbtn:hover { background: var(--soft); color: var(--ink); }
      .iconbtn svg { width: 15px; height: 15px; }

      .update {
        display: flex; align-items: flex-start; gap: 9px;
        padding: 10px 12px; border-radius: 11px;
        background: color-mix(in srgb, var(--warn) 12%, var(--card));
        border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--line));
        color: var(--ink); font-size: 11.5px; line-height: 1.4;
      }
      .update svg { width: 15px; height: 15px; flex: none; margin-top: 1px; color: var(--warn); }
      .update b { font-weight: 600; }

      .hint {
        font-size: 11px; color: var(--faint); line-height: 1.5;
      }
      .hint code {
        font-family: var(--mono); font-size: 10.5px;
        background: var(--soft); border: 1px solid var(--line);
        border-radius: 5px; padding: 1px 5px; color: var(--mut);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M6 12l6 6 6-6M5 20h14" /></svg>
        </div>
        <div>
          <h1>FDM Downloader</h1>
          <div class="sub">Send links straight to FDM</div>
        </div>
      </header>

      <div id="status" class="status">
        <span class="dot"></span>
        <span class="msg">Checking…</span>
      </div>

      <div id="update" class="update" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
        <span id="update-msg">A newer extension ships with FDM. Re-run <b>Set up extension</b> in FDM Settings, then reload here.</span>
      </div>

      <div class="toggle">
        <div>
          <div class="t-title">Intercept downloads</div>
          <div class="t-sub">Hand new downloads to FDM.</div>
        </div>
        <label class="switch" title="Intercept browser downloads">
          <input id="intercept" type="checkbox" checked />
          <span class="slider"></span>
        </label>
      </div>

      <details class="setup" id="setup">
        <summary>
          Connection
          <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6" /></svg></span>
        </summary>
        <div class="setup-body">
          <div>
            <label for="token">Pairing token</label>
            <div class="row">
              <input id="token" class="grow" type="password" autocomplete="off" spellcheck="false" placeholder="Paste from FDM Settings" />
              <button id="reveal" class="iconbtn" type="button" title="Show / hide">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
              </button>
            </div>
          </div>
          <div>
            <label for="port">Port</label>
            <div class="row">
              <input id="port" class="port" type="number" min="1" max="65535" value="53713" />
              <button id="save" class="primary grow" type="button">Save</button>
            </div>
          </div>
          <button id="test" class="ghost full" type="button">Test connection</button>
          <div class="hint">
            In FDM: <code>Settings → Browser extension</code> → copy the token, paste it above, <strong>Save</strong>.
          </div>
        </div>
      </details>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
